# ─────────────────────────────────────────────────────────────────
#  Al Safwa Trading — production deployment to GitHub Pages
#
#  Pipeline:  source → npm ci → vite build (--base=/) → dist/ → Pages
#  The artifact uploaded is ONLY the compiled application (dist/):
#  index.html + assets/ (JS, CSS, images). The repository root and
#  README.md are never deployed.
#
#  Custom domain: https://alsafwaoman.com (see public/CNAME)
#  REQUIRED repo setting: Settings → Pages → Source → "GitHub Actions"
# ─────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # --base=/ is required for the custom domain https://alsafwaoman.com/
        run: npm run build -- --base=/

      - name: Verify build output (must contain index.html + assets/)
        run: |
          test -f dist/index.html || (echo "BUILD FAILED: dist/index.html missing" && exit 1)
          test -d dist/assets || (echo "BUILD FAILED: dist/assets missing" && exit 1)
          ls -la dist dist/assets

      - name: Upload Pages artifact (dist/ only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
