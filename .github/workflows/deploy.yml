# Al Safwa Trading — production deployment to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        env:
          VITE_SUPABASE_URL: https://wdxjlfxepiqvklxlxwkw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1e9TK7R2CSPP7190qxO2jg_9emlfwgy
        run: npm run build -- --base=/

      - name: Generate static route entry points
        run: node scripts/prepare-pages.mjs

      - name: Prepare not-found fallback
        run: |
          cp dist/index.html dist/404.html
          sed -i 's#<title>Al Safwa Trading — Industrial Tools, Equipment & Machinery in Oman</title>#<title>Page Not Found — Al Safwa Trading</title>#' dist/404.html
          sed -i 's#name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"#name="robots" content="noindex,nofollow"#' dist/404.html

      - name: Verify production artifact
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -f dist/products/index.html
          test -f dist/brands/index.html
          test -f dist/rental/index.html
          test -f dist/services/index.html
          test -f dist/repair/index.html
          test -f dist/request-quote/index.html
          test -f dist/contact/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q 'wdxjlfxepiqvklxlxwkw.supabase.co' dist/assets/*.js
          echo "Verified root app, public routes, sitemap, robots and Supabase bundle."

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
