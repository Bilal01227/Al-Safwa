# Al Safwa Trading — production deployment to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production app
        env:
          VITE_SUPABASE_URL: https://wdxjlfxepiqvklxlxwkw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1e9TK7R2CSPP7190qxO2jg_9emlfwgy
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          npm run build -- --base=/
          if [ -n "${VITE_GA_MEASUREMENT_ID:-}" ]; then
            case "$VITE_GA_MEASUREMENT_ID" in G-[A-Z0-9]*) ;; *) echo "Invalid GA4 measurement ID"; exit 1 ;; esac
            grep -R -Fq "$VITE_GA_MEASUREMENT_ID" dist/assets
            echo "GA4 measurement ID is included in the production bundle."
          else
            echo "::warning::GA4 remains inactive until the VITE_GA_MEASUREMENT_ID repository secret is set."
          fi

      - name: Check static route generator syntax
        run: node --check scripts/prepare-pages.mjs

      - name: Generate static route entry points
        env:
          VITE_SUPABASE_URL: https://wdxjlfxepiqvklxlxwkw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_1e9TK7R2CSPP7190qxO2jg_9emlfwgy' }}
        run: node scripts/prepare-pages.mjs

      - name: Prepare 403 and 404 error documents
        run: node scripts/prepare-error-pages.mjs

      - name: Audit sitemap, canonicals, metadata and language alternates
        run: node scripts/validate-seo-artifacts.mjs

      - name: Verify production artifact
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/403.html
          test -f dist/403/index.html
          grep -q "noindex,nofollow" dist/404.html
          grep -q "noindex,nofollow" dist/403.html
          ! grep -q 'rel="canonical"' dist/404.html
          test -d dist/assets
          test -f dist/products/index.html
          # Regression guards for both product URLs reported in Search Console.
          TEXMO_ROUTE="products/texmo-motors-tspp-2-0-swimming-pool-pump-tspp-2-0"
          MAKITA_ROUTE="products/makita-4100nh-marble-cutter"
          for PRODUCT_ROUTE in "$TEXMO_ROUTE" "$MAKITA_ROUTE"; do
            test -s "dist/$PRODUCT_ROUTE/index.html"
            grep -Fq 'rel="canonical" href="https://alsafwaoman.com/'"$PRODUCT_ROUTE"'/"' "dist/$PRODUCT_ROUTE/index.html"
            grep -Fq '<loc>https://alsafwaoman.com/'"$PRODUCT_ROUTE"'/' "dist/sitemap.xml"
          done
          grep -Fq 'Swimming Pool Pump TSPP 2.0' "dist/$TEXMO_ROUTE/index.html"
          grep -Fq 'Makita 4100NH Marble Cutter' "dist/$MAKITA_ROUTE/index.html"
          # BreadcrumbList is emitted by the product-detail runtime after route data loads.
          ! grep -Fq '"@type":"Product"' "dist/$TEXMO_ROUTE/index.html"
          test -f dist/brands/index.html
          test -f dist/rental/index.html
          test -f dist/services/index.html
          test -f dist/repair/index.html
          test -f dist/request-quote/index.html
          test -f dist/contact/index.html
          test -f dist/catalogue-qr/index.html
          test -f dist/industrial-tools-nizwa/index.html
          test -f dist/ar/catalogue-qr/index.html
          test -f dist/ar/industrial-tools-nizwa/index.html
          # Customer contact must remain the original direct-call and WhatsApp line.
          grep -Fq '+968 9016 7345' dist/index.html
          # Verified Google Maps opening hours must remain in the public entity schema.
          grep -Fq '"openingHoursSpecification"' dist/index.html
          grep -Fq '"opens": "07:00"' dist/index.html
          grep -Fq '"opens": "15:30"' dist/index.html
          grep -Fq '"opens": "08:30"' dist/index.html
          ! grep -Fq '+968 9742 0541' dist/index.html
          grep -Fq 'RGVW+9WM' dist/index.html
          grep -Fq 'ChIJJ2Frsf77jj4RyRewZBd2WIY' dist/index.html
          grep -Fq 'Nizwa, Sinaya' dist/contact/index.html
          grep -Fq 'الصناعية، نزوى' dist/ar/index.html
          test -f dist/ar/index.html
          test -f dist/ar/products/index.html
          test -f dist/ar/brands/index.html
          test -f dist/ar/rental/index.html
          test -f dist/ar/services/index.html
          test -f dist/ar/repair/index.html
          test -f dist/ar/request-quote/index.html
          test -f dist/ar/contact/index.html
          test -s dist/images/catalogue-qr.svg
          ! grep -Fq "PATH_PLACEHOLDER" dist/images/catalogue-qr.svg
          grep -Fq "https://alsafwaoman.com/products/" dist/images/catalogue-qr.svg
          grep -Fq '<path d="M' dist/images/catalogue-qr.svg
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q 'wdxjlfxepiqvklxlxwkw.supabase.co' dist/assets/*.js
          echo "Verified root app, public routes, sitemap, robots and Supabase bundle."

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live routes, sitemap and product URLs after deployment
        run: |
          set -eu
          for path in \
            / \
            /products/ \
            /brands/ \
            /rental/ \
            /services/ \
            /repair/ \
            /request-quote/ \
            /contact/ \
            /catalogue-qr/ \
            /industrial-tools-nizwa/ \
            /ar/ \
            /ar/catalogue-qr/ \
            /ar/industrial-tools-nizwa/ \
            /ar/products/ \
            /ar/brands/ \
            /ar/rental/ \
            /ar/services/ \
            /ar/repair/ \
            /ar/request-quote/ \
            /ar/contact/; do
            output="$(mktemp)"
            status="$(curl --show-error --silent --location --output "$output" --write-out '%{http_code}' \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
              "https://alsafwaoman.com$path")"
            test "$status" = "200"
            grep -qi '<title>' "$output"
            grep -Fq "rel=\"canonical\" href=\"https://alsafwaoman.com$path" "$output"
            rm -f "$output"
            echo "HTTP 200 + canonical verified: $path"
          done
          sitemap="$(mktemp)"
          curl --fail --show-error --silent --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
            https://alsafwaoman.com/sitemap.xml -o "$sitemap"
          grep -q '<urlset' "$sitemap"
          grep -Fq '/products/texmo-motors-tspp-2-0-swimming-pool-pump-tspp-2-0/' "$sitemap"
          grep -Fq '/products/makita-4100nh-marble-cutter/' "$sitemap"
          rm -f "$sitemap"
          qr="$(mktemp)"
          curl --fail --show-error --silent --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
            https://alsafwaoman.com/images/catalogue-qr.svg -o "$qr"
          ! grep -Fq "PATH_PLACEHOLDER" "$qr"
          grep -Fq "https://alsafwaoman.com/products/" "$qr"
          grep -Fq '<path d="M' "$qr"
          rm -f "$qr"
          robots="$(mktemp)"
          curl --fail --show-error --silent --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
            https://alsafwaoman.com/robots.txt -o "$robots"
          grep -Fq 'Sitemap: https://alsafwaoman.com/sitemap.xml' "$robots"
          rm -f "$robots"
          for path in \
            /products/makita-4100nh-marble-cutter/ \
            /products/texmo-motors-tspp-2-0-swimming-pool-pump-tspp-2-0/; do
            output="$(mktemp)"
            status="$(curl --show-error --silent --location --output "$output" --write-out '%{http_code}' \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
              "https://alsafwaoman.com$path")"
            test "$status" = "200"
            grep -qi '<title>' "$output"
            grep -Fq "rel=\"canonical\" href=\"https://alsafwaoman.com$path" "$output"
            rm -f "$output"
            echo "HTTP 200 + canonical verified: $path"
          done
          echo "Live production routes, sitemap, robots and Search Console regression products passed."
