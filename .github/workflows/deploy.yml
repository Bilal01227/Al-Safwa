# Al Safwa Trading — production deployment to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production app
        run: npm run build -- --base=/

      - name: Prepare GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          test -f dist/404.html || { echo "ERROR: dist/404.html missing"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets missing"; exit 1; }
          grep -q '<div id="root">' dist/index.html || { echo "ERROR: invalid Vite app shell"; exit 1; }
          echo "Build and SPA fallback verified."

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
